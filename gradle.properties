# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft / NeoForge
# Keep these in sync with the version of NeoForge you develop against.
minecraft_version=26.1.1
minecraft_version_range=[26.1,26.2)
neo_version=26.1.1.15-beta
neo_version_range=[26.1.0.19-beta,)

# Mod metadata
mod_id=discordpresence
mod_name=Discord Presence
mod_license=MIT
mod_version=1.0.6
mod_group_id=dev.discordpresence
mod_authors=Jumayusi

# Discord application ID used by official builds.
#
# This is intentionally not a user-facing config option. Provide it at build time:
#
#   ./gradlew build -PdiscordApplicationId=123456789012345678
#
# or set the DISCORD_APPLICATION_ID environment variable. A build without an ID
# still compiles, but the presence stays hidden until the game is launched with a
# jar that contains one. Never put an application ID in this file.
# discordApplicationId=123456789012345678
