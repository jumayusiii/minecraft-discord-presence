name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon "-PdiscordApplicationId=${{ vars.DISCORD_APPLICATION_ID }}"

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: discordpresence
          path: build/libs/discordpresence-*.jar
          if-no-files-found: error
