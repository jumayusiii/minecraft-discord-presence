name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require a Discord application ID
        env:
          DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
        run: |
          if [ -z "$DISCORD_APPLICATION_ID" ]; then
            echo "::error::Set the DISCORD_APPLICATION_ID repository variable before releasing."
            exit 1
          fi

      - name: Build release jar
        env:
          DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
        run: ./gradlew build --no-daemon "-PdiscordApplicationId=$DISCORD_APPLICATION_ID"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/discordpresence-*.jar
          generate_release_notes: true
